<form [formRoot]="taskForm">
    <h2 mat-dialog-title>
        <span>Add Task</span>
    </h2>
    <mat-dialog-content>
        <mat-form-field>
            <mat-label>Task</mat-label>
            <textarea matInput rows="2" [formField]="taskForm.task" cdkFocusInitial></textarea>
        </mat-form-field>
    </mat-dialog-content>
    <mat-dialog-actions>
        <button type="button" matButton mat-dialog-close>Cancel</button>
        <button type="submit" matButton="tonal">Save</button>
    </mat-dialog-actions>
</form>
