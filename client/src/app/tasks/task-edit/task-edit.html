<form [formRoot]="taskForm">
    <mat-card>
        <mat-card-content>
            <mat-form-field>
                <mat-label>Task</mat-label>
                <textarea matInput rows="2" [formField]="taskForm.task"></textarea>
            </mat-form-field>
        </mat-card-content>
        <mat-card-actions>
            <button type="submit" matButton="tonal">
                <span>Save</span>
            </button>
            <a routerLink="/tasks" matButton>
                <span>Cancel</span>
            </a>
        </mat-card-actions>
    </mat-card>
</form>
