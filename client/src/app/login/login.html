<form [formRoot]="authForm">
    <mat-card>
        <mat-card-header>
            <mat-card-title>Sign in to your account</mat-card-title>
            <mat-card-subtitle>Enter your credentials to continue</mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
            <mat-form-field appearance="outline">
                <mat-label>Username</mat-label>
                <mat-icon matPrefix>person_outline</mat-icon>
                <input type="text" matInput [formField]="authForm.username" autocomplete="username" />
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Password</mat-label>
                <mat-icon matPrefix>lock_outline</mat-icon>
                <input [type]="showPassword() ? 'text' : 'password'" matInput [formField]="authForm.password" autocomplete="current-password" />
                <button type="button" matIconButton matSuffix (click)="toggleShowPassword()" [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
                    <mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
            </mat-form-field>
        </mat-card-content>

        <mat-card-actions>
            <button type="submit" matButton="tonal">Sign In</button>
        </mat-card-actions>
    </mat-card>
</form>
